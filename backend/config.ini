; Settings for the API. Each section is in [brackets].
; Paths are relative to the backend folder.

[server]
port = 3000
host = 0.0.0.0

[database]
; The SQLite database file. Created automatically on first run.
file = data/app.db
; The SQL file that defines the tables (one section per table).
schema = schema.sql

[seed]
; One-time import used by:  npm run seed
; These are the old JavaScript data files. After seeding, the database is
; the only place the data lives and these files can be deleted.
content = data/content.js
resources = data/resources.js
centers = data/centers.js
